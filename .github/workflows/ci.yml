name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: backend tests + schema
    runs-on: ubuntu-latest
    env:
      PYTHONUNBUFFERED: "1"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: run test suite (sqlite)
        run: python manage.py test -v 1
      - name: composition ok (OpenAPI generates)
        run: python manage.py spectacular --file /tmp/schema.yml && test -s /tmp/schema.yml

  frontend:
    name: frontend lint + spec + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build