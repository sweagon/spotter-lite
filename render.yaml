# Render blueprint — spotter backend Django API.
# Push this repo to GitHub, New -> Blueprint -> pick this file.
# Attaches: a managed Postgres and the API web service.
# The hourly HOS-watchdog runs as a free GitHub Actions cron
# (.github/workflows/watchdog.yml), not a Render cron (no free tier).
# The React frontend deploys to Vercel (see ../vercel.json).
databases:
  - name: spotter-db
    plan: free
    databaseName: spotter
    user: spotter

services:
  - type: web
    name: spotter-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate"
    startCommand: "gunicorn spotter_backend.wsgi:application --bind 0.0.0.0:$PORT --workers 2"
    healthCheckPath: /api/health/
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: spotter-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com,spotter-backend-t1z4.onrender.com,localhost,127.0.0.1"
      # only the org's real frontend origins below; never flip allow-all in prod
      - key: CORS_ALLOWED_ORIGINS
        value: "https://spotter-trip-planner.vercel.app,https://spotter-trip-planner-git-main-morpheusout.vercel.app,https://spotter-lite.vercel.app"